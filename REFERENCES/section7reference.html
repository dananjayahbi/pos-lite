<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials Section</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcf8f5;
    }

    /* Section Wrapper */
    .testimonial-section {
      background-color: #f9f5f0;
      padding: 80px 20px;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
    }

    .testimonial-container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* Header Styling */
    .subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a68c78;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 400;
      color: #332d29;
      margin-bottom: 20px;
    }

    .main-title em {
      font-style: italic;
      color: #b08d6d;
    }

    /* Ornamental Divider */
    .ornament-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .ornament-divider::before,
    .ornament-divider::after {
      content: '';
      width: 60px;
      height: 1px;
      background-color: #e5d7cb;
    }

    .ornament-divider span {
      color: #b08d6d;
      font-size: 10px;
    }

    /* Testimonial Cards */
    .testimonial-card-wrapper {
      margin-bottom: 25px;
    }

    .testimonial-card {
      display: none;
      background: #ffffff;
      padding: 50px 60px;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      max-width: 700px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease-in-out;
    }

    .testimonial-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quote-icon {
      font-family: 'Cormorant Garamond', serif;
      font-size: 50px;
      line-height: 1;
      color: #ecdcd0;
      margin-bottom: 10px;
    }

    .stars {
      color: #b08d6d;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 19px;
      line-height: 1.7;
      color: #63574e;
      margin-bottom: 30px;
    }

    .author-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .author-wrapper::before,
    .author-wrapper::after {
      content: '';
      width: 25px;
      height: 1px;
      background-color: #d1c4b8;
    }

    .author-name {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #332d29;
      font-weight: 500;
    }

    /* Pagination Dots Container */
    .pagination-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #d9cac0;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      border: none;
      outline: none;
    }

    .dot.active {
      background-color: #b08d6d;
      transform: scale(1.2);
    }

    @media (max-width: 600px) {
      .testimonial-card {
        padding: 35px 25px;
      }
      .main-title {
        font-size: 28px;
      }
      .quote-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <section class="testimonial-section">
    <div class="testimonial-container">
      <p class="subtitle">Real Experiences</p>
      <h2 class="main-title">What Our <em>Community</em> Says</h2>
      
      <div class="ornament-divider">
        <span>◆</span>
      </div>

      <div class="testimonial-card-wrapper">
        
        <!-- Testimonial 1 -->
        <div class="testimonial-card active">
          <div class="quote-icon">“</div>
          <div class="stars">★ ★ ★ ★ ★</div>
          <p class="quote-text">
