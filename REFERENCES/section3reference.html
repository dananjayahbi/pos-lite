<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Categories Slider</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      padding: 40px 20px;
    }

    /* Container wrapper for relative positioning of buttons */
    .slider-container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 1D Grid Slider with Scroll Snap */
    .category-slider {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc(25% - 12px); /* Displays 4 cards at a time on desktop */
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding-bottom: 10px;
      
      /* Hide scrollbars */
      -ms-overflow-style: none;  /* IE/Edge */
      scrollbar-width: none;  /* Firefox */
    }

    .category-slider::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Individual product card */
    .category-card {
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #333333;
    }

    /* Square image wrapper */
    .image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .category-card:hover .image-wrapper img {
      transform: scale(1.03);
    }

    /* Typography styling */
    .category-info {
      text-align: center;
      margin-top: 14px;
    }

    .category-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #2b2b2b;
      margin-bottom: 4px;
    }

    .product-count {
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #8e8e8e;
    }

    /* Navigation Buttons */
    .nav-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid #e0e0e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #ffffff;
      transform: translateY(-50%) scale(1.05);
    }

    .nav-btn.prev {
      left: -20px;
    }

    .nav-btn.next {
      right: -20px;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      fill: #333333;
    }

    /* Responsive adjustments for tablet and mobile */
    @media (max-width: 900px) {
      .category-slider {
        grid-auto-columns: calc(33.333% - 11px); /* 3 cards visible */
      }
      .nav-btn.prev { left: -10px; }
      .nav-btn.next { right: -10px; }
    }

    @media (max-width: 600px) {
      .category-slider {
        grid-auto-columns: calc(50% - 8px); /* 2 cards visible */
      }
    }
  </style>
</head>
<body>

  <div class="slider-container">
    <!-- Navigation Buttons -->
    <button class="nav-btn prev" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="nav-btn next" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>

    <!-- 1D Category Slider -->
    <section class="category-slider" id="slider">
      <!-- Product 1 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Face+Serum" alt="Face Serum">
        </div>
        <div class="category-info">
          <h3 class="category-title">Face Serum</h3>
          <span class="product-count">4 Products</span>
        </div>
      </a>

      <!-- Product 2 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Face+Cream" alt="Face Cream">
        </div>
        <div class="category-info">
          <h3 class="category-title">Face Cream</h3>
          <span class="product-count">10 Products</span>
        </div>
      </a>

      <!-- Product 3 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Hair+Care" alt="Hair Care">
        </div>
        <div class="category-info">
          <h3 class="category-title">Hair Care</h3>
          <span class="product-count">1 Product</span>
        </div>
      </a>

      <!-- Product 4 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Body+Care" alt="Body Care">
        </div>
        <div class="category-info">
          <h3 class="category-title">Body Care</h3>
          <span class="product-count">14 Products</span>
        </div>
      </a>

      <!-- Product 5 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Sunscreen" alt="Sunscreen">
        </div>
        <div class="category-info">
          <h3 class="category-title">Sunscreen</h3>
          <span class="product-count">6 Products</span>
        </div>
      </a>

      <!-- Product 6 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Face+Wash" alt="Face Wash">
        </div>
        <div class="category-info">
          <h3 class="category-title">Face Wash</h3>
          <span class="product-count">8 Products</span>
        </div>
      </a>

      <!-- Product 7 -->
      <a href="#" class="category-card">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/600x600?text=Lip+Balm" alt="Lip Balm">
        </div>
        <div class="category-info">
          <h3 class="category-title">Lip Balm</h3>
          <span class="product-count">3 Products</span>
        </div>
      </a>
    </section>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Scroll by the width of one card + gap
    function getScrollAmount() {
      const card = slider.querySelector('.category-card');
      const gap = parseInt(window.getComputedStyle(slider).gap) || 16;
      return card.offsetWidth + gap;
    }

    nextBtn.addEventListener('click', () => {
      slider.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
    });

    prevBtn.addEventListener('click', () => {
      slider.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
    });
  </script>

</body>
</html>
